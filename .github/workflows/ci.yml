name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_journey:
        description: Run all browser tests and render complete musical loops
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full_journey && 20 || 5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-shell-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Critical development browser checks
        if: ${{ !inputs.full_journey }}
        run: npm run test:e2e:ci
      - name: Critical production browser checks
        if: ${{ !inputs.full_journey }}
        run: npm run test:e2e:ci:production
      - name: Complete adventure and audio checks
        if: ${{ inputs.full_journey }}
        run: npm run test:e2e
        env:
          BT_FULL_QA: '1'
      - name: Complete production checks
        if: ${{ inputs.full_journey }}
        run: npm run test:e2e:production
