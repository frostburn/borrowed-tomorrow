name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_journey:
        description: Play every disk and render complete musical loops
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full_journey && 20 || 8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke checks
        if: ${{ !inputs.full_journey }}
        run: npm run test:e2e:smoke
      - name: Complete adventure and audio checks
        if: ${{ inputs.full_journey }}
        run: npm run test:e2e
        env:
          BT_FULL_QA: '1'
